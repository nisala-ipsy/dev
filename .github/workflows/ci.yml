name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint shell scripts with shellcheck
        run: |
          find . -path ./home -prune -o -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Create bind-mount directory
        run: |
          mkdir -p home
          sudo chown -R 1000:1000 home

      - name: Pre-download release assets
        run: |
          mkdir -p .dl
          gh release download v1.39.0 --repo Schniz/fnm --pattern 'fnm-linux.zip' --output .dl/fnm.zip
          gh release download v1.25.1 --repo starship/starship --pattern 'starship-x86_64-unknown-linux-gnu.tar.gz' --output .dl/starship.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build image
        run: docker compose build

      - name: Verify container
        run: |
          docker compose run --rm -T \
            -v "${GITHUB_WORKSPACE}:/ci:ro" \
            dev \
            bash -lc 'bash /ci/.github/scripts/verify-docker-container.sh'

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Create bind-mount directory
        run: |
          mkdir -p home
          sudo chown -R 1000:1000 home

      - name: Pre-download release assets
        run: |
          mkdir -p .dl
          gh release download v1.39.0 --repo Schniz/fnm --pattern 'fnm-linux.zip' --output .dl/fnm.zip
          gh release download v1.25.1 --repo starship/starship --pattern 'starship-x86_64-unknown-linux-gnu.tar.gz' --output .dl/starship.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build image
        run: docker compose build

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dev-ubuntu-cursor:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
