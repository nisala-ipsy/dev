services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: dev-ubuntu-cursor:latest
    container_name: dev
    working_dir: /home/dev
    volumes:
      - ./home:/home/dev
    stdin_open: true
    tty: true
    restart: unless-stopped
